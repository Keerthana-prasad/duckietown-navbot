# Duckiebot CV + LLM Natural-Language Navigation System Configuration

system:
  mode: "simulation"        # Options: "simulation" | "hardware"
  log_level: "INFO"         # Options: "DEBUG", "INFO", "WARNING", "ERROR"
  log_file: "duckiebot.log"

robot:
  name: "entebot209"
  hostname: "entebot209.local"
  ip_address: "192.168.1.100"  # Set if static, or resolved via mDNS
  ros_version: "ros1_noetic"   # Standard Duckietown Ente DB21J configuration
  connection_protocol: "websocket" # Options: "websocket" (rosbridge:9090), "http_rest", "direct_rospy"
  rosbridge_port: 9090
  dashboard_port: 80
  
  # Standard Duckietown Ente topics
  topics:
    camera_compressed: "/entebot209/camera_node/image/compressed"
    camera_raw: "/entebot209/camera_node/image/raw"
    camera_info: "/entebot209/camera_node/camera_info"
    car_cmd: "/entebot209/car_cmd_switch_node/cmd"               # duckietown_msgs/Twist2DStamped
    wheels_cmd: "/entebot209/wheels_driver_node/wheels_cmd"      # duckietown_msgs/WheelsCmdStamped
    emergency_stop: "/entebot209/wheels_driver_node/emergency_stop"
    tof_range: "/entebot209/front_center_tof_driver_node/range"   # sensor_msgs/Range (if DB21J ToF present)
    left_wheel_encoder: "/entebot209/left_wheel_encoder_node/tick"
    right_wheel_encoder: "/entebot209/right_wheel_encoder_node/tick"
    led_emitter: "/entebot209/led_emitter_node/led_pattern"

camera:
  source: "mock"            # Options: "mock", "ros_topic", "http_stream", "opencv_device"
  http_stream_url: "http://entebot209.local:8085/video/streaming"
  device_id: 0
  fps: 15
  width: 640
  height: 480
  jpeg_quality: 75

computer_vision:
  model_type: "yolo"        # Options: "yolo", "mock", "onnx"
  model_name: "yolov8n.pt"  # Lightweight nano model suited for Jetson Nano 4GB
  confidence_threshold: 0.40
  iou_threshold: 0.45
  device: "cpu"             # "cuda" on Jetson Nano, "cpu" on laptop / dev
  
  # Known landmark / object vocabulary mapping
  landmarks:
    laboratory:
      aliases: ["lab", "research room", "science lab", "station a"]
      visual_indicator: "bottle"
      color_hint: "blue"
    entrance:
      aliases: ["door", "gate", "front entrance", "entry"]
      visual_indicator: "box"
      color_hint: "brown"
    pickup_point:
      aliases: ["pickup", "loading area", "dock", "station b"]
      visual_indicator: "cup"
      color_hint: "white"
    charging_station:
      aliases: ["docking station", "charger", "power base"]
      visual_indicator: "chair"
      color_hint: "black"
    duckie_crossing:
      aliases: ["duckies", "duckie crossing", "pedestrian area"]
      visual_indicator: "duckie"
      color_hint: "yellow"

  lane_detection:
    enabled: true
    hsv_yellow_low: [20, 90, 90]
    hsv_yellow_high: [35, 255, 255]
    hsv_white_low: [0, 0, 180]
    hsv_white_high: [180, 60, 255]
    roi_top_ratio: 0.55     # Only look at bottom 45% of image for road lanes
    lane_width_nominal_px: 240

  obstacle_detection:
    min_distance_meters: 0.22      # Emergency stop if obstacle within 22cm
    caution_distance_meters: 0.45  # Slow down if obstacle within 45cm
    bounding_box_area_stop: 0.28   # If obstacle covers > 28% of frame height & width
    bounding_box_area_caution: 0.14

llm:
  provider: "gemini"        # Options: "gemini", "openai", "mock"
  model: "gemini-1.5-flash" # Fast, cost-efficient multimodal/text model
  api_key_env_var: "GEMINI_API_KEY"
  temperature: 0.1
  max_tokens: 600
  timeout_seconds: 12.0
  fallback_to_heuristic: true # If offline/no API key, parse using semantic pattern matcher

navigation:
  max_linear_velocity: 0.22        # m/s (safe physical cap)
  max_angular_velocity: 2.2        # rad/s
  default_cruise_velocity: 0.15    # m/s
  obstacle_crawl_velocity: 0.08    # m/s
  turn_speed: 1.0                  # rad/s
  kp_lane_centering: 0.75          # Proportional gain for lane alignment
  watchdog_timeout_seconds: 1.0    # Stop if no heartbeat received for 1.0s
  goal_reached_bbox_ratio: 0.25    # When target occupies > 25% height in center
  search_turn_duration_s: 3.0      # How long to spin while searching for target

safety:
  enable_hardware_movement: false # MUST be explicitly flipped to true by user for physical motors
  require_confirm_dialog: true
  emergency_stop_deceleration: 5.0
  auto_stop_on_camera_loss: true
  camera_timeout_seconds: 2.0
  max_continuous_run_time_s: 180   # Auto-idle after 3 minutes to protect battery

dashboard:
  host: "0.0.0.0"
  port: 8000
  stream_fps: 15
  telemetry_update_hz: 5
